title: "Digital Pasts Lab"
short_title: "DigPasts()"
description: "The Digital Pasts Lab at Ariel University works in Ancient Language Processing and digital humanities, bringing historians, philologists and computer scientists together to read, translate and map ancient sources."
tagline: "We build computational methods for reading the languages and scripts of the ancient world."
url: "https://digitalpasts.github.io"
baseurl: ""
lang: en

email: "digpasts@gmail.com"
github: "https://github.com/DigitalPasts"
twitter: "https://twitter.com/DigPastsLab"
twitter_handle: "DigPastsLab"

# External tools
ben_code: "https://github.com/ludovicus-hispanicus/Ben-App"

# Show a small "To confirm" tag on data entries marked `confirm: true`.
# Set to false before the site goes live.
show_confirm: true

# Main navigation, in order
navigation:
  - title: Research
    url: /research/
  - title: Tools & Data
    url: /tools/
  - title: Publications
    url: /publications/
  - title: People
    url: /people/
  - title: News
    url: /news/

# One file per project in _projects/, published at /research/<file-name>/
collections:
  projects:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
