# Tools, datasets, code and teaching resources made by the lab.
# Fields:
#   title:        name
#   kind:         Tool | Dataset | Code | Course
#   description:  one or two sentences
#   project:      project file name from _projects/ (optional)
#   links:        list of {label, url}

- title: Babylonian Engine (BEn)
  kind: Tool
  description: "Modular desktop platform for cuneiform recognition, transliteration, lemmatization and curation, with pluggable AI models."
  project: ben
  links:
    - label: BEn app on GitHub
      url: https://github.com/ludovicus-hispanicus/Ben-App

- title: Atrahasis
  kind: Tool
  description: "Restores missing words in broken cuneiform texts. Predicts the right word 85% of the time on Achaemenid-period Babylonian records."
  project: ben
  links:
    - label: Paper (PNAS 2020)
      url: https://doi.org/10.1073/pnas.2003794117

- title: Akkademia
  kind: Tool
  description: "Models that transliterate and segment Unicode cuneiform signs, reaching 96.7% accuracy on Neo-Assyrian royal inscriptions."
  project: ben
  links:
    - label: Paper (PLOS ONE 2020)
      url: https://doi.org/10.1371/journal.pone.0240511

- title: Akkadian machine translation
  kind: Tool
  description: "Neural model translating Akkadian cuneiform into English, from signs or from transliteration."
  project: akkadian-mt
  links:
    - label: Paper (PNAS Nexus 2023)
      url: https://doi.org/10.1093/pnasnexus/pgad096

- title: MAPA Gazetteer
  kind: Dataset
  description: "Linked open data gazetteer of Uruk and its hinterland in the first millennium BCE, in the Linked Places format."
  project: mapa
  links:
    - label: Zenodo
      url: https://zenodo.org/record/6411251
    - label: GitHub
      url: https://github.com/DigitalPasts/MAPA

- title: EvaCun
  kind: Dataset
  description: "Shared-task datasets for cuneiform NLP: machine translation (2023), lemmatization and token prediction (2025)."
  project: evacun
  links:
    - label: Task website
      url: https://digitalpasts.github.io/EvaCUN/

- title: DigitalPasts on GitHub
  kind: Code
  description: "Source code and data for the lab's projects."
  links:
    - label: Repositories
      url: https://github.com/DigitalPasts

- title: The Ancient Middle East, a map story
  kind: Course
  description: "Hebrew introduction to the physical and cultural geography of the ancient Middle East, as an interactive map journal."
  links:
    - label: Open the story
      url: https://www.arcgis.com/apps/MapJournal/index.html?appid=0d8ea53679044b78b8237690b5e4c842

- title: eAkkadian
  kind: Course
  description: "An online coursebook for doing Assyriology digitally."
  links:
    - label: Open the coursebook
      url: https://digitalpasts.github.io/eAkkadian/

- title: Hittite glossed texts
  kind: Dataset
  description: "Hittite texts with German translation, prepared for machine learning."
  project: hittite-ml
  links:
    - label: Zenodo
      url: https://doi.org/10.5281/zenodo.14266302

- title: Neo-Assyrian metaphor dataset
  kind: Dataset
  description: "Body part construction metaphors in Neo-Assyrian letters."
  project: metaphor
  links:
    - label: Zenodo
      url: https://doi.org/10.5281/zenodo.8432073

- title: BONUS SCRIBA
  kind: Dataset
